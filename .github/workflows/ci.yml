name: CI

# Runs on every push and pull request. The point is that the fare engine and
# the assignment rules — which encode Safeco's commercial promises — cannot be
# changed without their tests passing.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # supabase-js >= 2.112 declares engines.node >= 22.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck all three apps
        run: npm run typecheck

      - name: Test
        run: npm test
